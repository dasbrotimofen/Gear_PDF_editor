name: Windows build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build GearPdf.slnx -c Release
      - run: dotnet run --project tests/GearPdf.Core.Checks -c Release
      - run: dotnet run --project tests/GearPdf.Pdf.Checks -c Release
